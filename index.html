<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔵書帖 － マイ本棚</title>
<style>
  :root{
    --paper:#FAF7F0;
    --paper-2:#F1ECE0;
    --ink:#2B3A4A;
    --ink-soft:#5C6B78;
    --line:#DCD4C2;
    --seal:#B5453A;
    --seal-soft:#E8D9C8;
    --gold:#B8945A;
    --white:#FFFDF9;
    --shadow: 0 1px 3px rgba(43,58,74,0.08);
    --radius: 6px;
    --mincho: "Yu Mincho","YuMincho","游明朝","Hiragino Mincho ProN","Noto Serif JP",serif;
    --gothic: "Yu Gothic","YuGothic","游ゴシック","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--gothic);
    line-height:1.6;
    min-height:100vh;
  }
  /* subtle paper texture via layered gradients */
  body{
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184,148,90,0.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(181,69,58,0.04), transparent 45%);
    background-attachment:fixed;
  }

  header.top{
    position:sticky; top:0; z-index:30;
    background:rgba(250,247,240,0.92);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 20px 12px;
  }
  .top-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px; max-width:980px; margin:0 auto;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand .seal-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px;height:26px;border-radius:3px;
    background:var(--seal); color:var(--white);
    font-family:var(--mincho); font-size:14px; font-weight:700;
    flex:none;
  }
  .brand h1{
    font-family:var(--mincho);
    font-size:20px; font-weight:600; letter-spacing:.04em;
    margin:0; color:var(--ink);
  }
  .brand .count-badge{
    font-size:12px; color:var(--ink-soft); font-family:var(--gothic);
  }
  .actions{display:flex; align-items:center; gap:8px;}

  .search-box{
    position:relative;
  }
  .search-box input{
    width:220px;
    padding:8px 12px 8px 30px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--white);
    font-family:var(--gothic);
    font-size:13px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, width .2s;
  }
  .search-box input:focus{border-color:var(--gold); width:250px;}
  .search-box svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; opacity:.5;}

  button.btn{
    font-family:var(--gothic);
    font-size:13px;
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--white);
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .15s, transform .1s;
  }
  button.btn:hover{opacity:.85;}
  button.btn:active{transform:scale(.97);}
  button.btn.ghost{
    background:transparent; color:var(--ink); border-color:var(--line);
  }
  button.btn.ghost:hover{border-color:var(--ink);}
  button.btn.seal{background:var(--seal); border-color:var(--seal);}
  button.btn.small{padding:5px 12px; font-size:12px;}

  main{
    max-width:980px; margin:0 auto; padding:18px 20px 80px;
  }

  .cat-nav{
    display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;
  }
  .cat-chip{
    font-family:var(--gothic);
    font-size:12px;
    padding:5px 12px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .cat-chip.active{
    background:var(--ink); color:var(--white); border-color:var(--ink);
  }

  .category-section{
    margin-bottom:6px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--white);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .category-section + .category-section{ margin-top:10px; }

  .cat-header{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    cursor:pointer;
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
    user-select:none;
  }
  .cat-header .bar{
    width:4px; height:16px; border-radius:2px; background:var(--seal); flex:none;
  }
  .cat-header h2{
    font-family:var(--mincho);
    font-size:15px; font-weight:600; margin:0; letter-spacing:.03em;
    flex:1;
  }
  .cat-header .n{
    font-size:12px; color:var(--ink-soft);
  }
  .cat-header .chev{
    width:10px;height:10px; border-right:2px solid var(--ink-soft); border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg); transition:transform .15s; flex:none;
  }
  .category-section.collapsed .chev{transform:rotate(-45deg);}
  .category-section.collapsed .cat-body{display:none;}

  .cat-body{ }

  .book-row{
    display:grid;
    grid-template-columns: minmax(0,1fr) 130px 20px;
    align-items:center;
    gap:10px;
    padding:9px 14px;
    border-bottom:1px solid var(--paper-2);
    cursor:pointer;
    transition:background .1s;
  }
  .book-row:last-child{border-bottom:none;}
  .book-row:hover{background:var(--paper-2);}
  .book-row .titles{min-width:0;}
  .book-row .title{
    font-family:var(--mincho);
    font-size:14.5px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .book-row .synopsis-preview{
    font-size:11.5px; color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:1px;
  }
  .book-row .author{
    font-size:12px; color:var(--ink-soft);
    text-align:right;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .book-row .caret{
    width:8px;height:8px; border-right:2px solid var(--line); border-bottom:2px solid var(--line);
    transform:rotate(-45deg); transition:transform .15s;
  }
  .book-row.open .caret{transform:rotate(135deg); border-color:var(--seal);}

  .book-detail{
    padding:0 14px 14px 14px;
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .book-detail .row{margin-bottom:8px;}
  .book-detail label{
    display:block; font-size:11px; color:var(--ink-soft); margin-bottom:3px; letter-spacing:.03em;
  }
  .book-detail .synopsis-text{
    font-size:13px; line-height:1.7; color:var(--ink);
  }
  .book-detail textarea{
    width:100%; min-height:56px; resize:vertical;
    font-family:var(--gothic); font-size:13px; color:var(--ink);
    border:1px solid var(--line); border-radius:5px; padding:8px;
    background:var(--white);
    outline:none;
  }
  .book-detail textarea:focus{border-color:var(--gold);}
  .book-detail .memo-actions{display:flex; justify-content:flex-end; gap:6px; margin-top:4px;}
  .book-detail .del-row{display:flex; justify-content:flex-end; margin-top:6px;}
  .del-link{
    font-size:11px; color:#a35049; background:none; border:none; cursor:pointer; text-decoration:underline;
    font-family:var(--gothic);
  }

  .empty-hint{
    padding:30px 14px; text-align:center; color:var(--ink-soft); font-size:13px;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(43,58,74,0.45);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper); border-radius:10px; width:100%; max-width:460px;
    max-height:88vh; overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);
    border:1px solid var(--line);
  }
  .modal-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--paper); z-index:2;
  }
  .modal-head h3{
    font-family:var(--mincho); font-size:16px; margin:0; font-weight:600;
  }
  .modal-close{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-soft); line-height:1;}
  .modal-body{padding:16px 20px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px;}
  .field select, .field input[type=text]{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px;
    font-family:var(--gothic); font-size:14px; background:var(--white); color:var(--ink); outline:none;
  }
  .field select:focus, .field input[type=text]:focus{border-color:var(--gold);}
  .search-inline{display:flex; gap:8px;}
  .search-inline input{flex:1;}
  .status-line{font-size:12px; color:var(--ink-soft); margin:6px 0 2px; min-height:16px;}
  .result-card{
    background:var(--white); border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:6px;
  }
  .result-card .cover-row{display:flex; gap:10px;}
  .result-card img{width:52px; height:76px; object-fit:cover; border-radius:3px; flex:none; background:var(--paper-2);}
  .modal-footer{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-top:12px; border-top:1px solid var(--line);}

  footer.foot{
    text-align:center; color:var(--ink-soft); font-size:11px; padding:20px 20px 40px; max-width:980px; margin:0 auto;
  }

  @media (max-width:600px){
    .search-box input{width:150px;}
    .search-box input:focus{width:170px;}
    .book-row{grid-template-columns: minmax(0,1fr) 90px 16px;}
    .brand h1{font-size:17px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <span class="seal-mark">蔵</span>
      <h1>蔵書帖</h1>
      <span class="count-badge" id="totalCount"></span>
    </div>
    <div class="actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="タイトル・著者で検索">
      </div>
      <button class="btn seal" id="openAddBtn">＋ 追加</button>
    </div>
  </div>
</header>

<main>
  <div class="cat-nav" id="catNav"></div>
  <div id="shelf"></div>
</main>

<footer class="foot">
  蔵書帖 — このブラウザに保存されます（他の端末とは共有されません）
</footer>

<!-- Add Book Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3>本を追加</h3>
      <button class="modal-close" id="closeModalBtn">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>カテゴリ</label>
        <select id="newCategory"></select>
      </div>
      <div class="field">
        <label>作品名</label>
        <div class="search-inline">
          <input type="text" id="newTitle" placeholder="例：舟を編む">
          <button class="btn ghost small" id="searchBookBtn">検索</button>
        </div>
        <div class="status-line" id="searchStatus"></div>
      </div>

      <div id="searchResultArea" style="display:none;">
        <div class="result-card">
          <div class="cover-row">
            <img id="resultCover" src="" alt="" onerror="this.style.display='none'">
            <div style="flex:1;">
              <div class="field" style="margin-bottom:8px;">
                <label>著者</label>
                <input type="text" id="resultAuthor">
              </div>
            </div>
          </div>
          <div class="field" style="margin-top:8px; margin-bottom:0;">
            <label>あらすじ</label>
            <textarea id="resultSynopsis" style="width:100%; min-height:70px; font-family:var(--gothic); font-size:13px; padding:8px; border:1px solid var(--line); border-radius:5px;"></textarea>
          </div>
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label>メモ（任意）</label>
        <textarea id="newMemo" style="width:100%; min-height:50px; font-family:var(--gothic); font-size:13px; padding:8px; border:1px solid var(--line); border-radius:5px;"></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn ghost" id="cancelAddBtn">キャンセル</button>
        <button class="btn seal" id="confirmAddBtn" disabled>本棚に登録</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ カテゴリ順序 ============ */
const CATEGORY_ORDER = ["日本文学","海外文学","児童文学","洋書","新書・実用書","その他"];

/* ============ 初期データ（Wordファイルより整理） ============ */
const INITIAL_DATA = [
/* ---- 児童文学 55 ---- */
{c:"児童文学",t:"クルミ割りとネズミの王様",a:"E・T・A・ホフマン",s:"クリスマスの夜、少女がもらったくるみ割り人形とネズミの王様の戦いに巻き込まれる幻想物語。"},
{c:"児童文学",t:"ハイジ",a:"ヨハンナ・シュピリ",s:"アルプスの山で祖父と暮らす少女ハイジの成長と友情を描く物語。"},
{c:"児童文学",t:"宝島",a:"ロバート・ルイス・スティーヴンソン",s:"少年ジムが海賊の残した宝の地図を手に、宝探しの冒険に出る物語。"},
{c:"児童文学",t:"十五少年漂流記",a:"ジュール・ヴェルヌ",s:"無人島に漂着した15人の少年たちが力を合わせて生き抜く冒険譚。"},
{c:"児童文学",t:"オズの魔法使い",a:"L・フランク・ボーム",s:"竜巻でオズの国に飛ばされた少女ドロシーが仲間と家路を目指す物語。"},
{c:"児童文学",t:"ピーターラビットのおはなし",a:"ビアトリクス・ポター",s:"いたずら好きのうさぎピーターが農園で騒動を起こす絵本。"},
{c:"児童文学",t:"グロースターの仕立て屋",a:"ビアトリクス・ポター",s:"病気の仕立て屋を助けるねずみたちの心温まる物語。"},
{c:"児童文学",t:"ベンジャミンバニーのおはなし",a:"ビアトリクス・ポター",s:"ピーターのいとこベンジャミンが農園に忍び込む冒険譚。"},
{c:"児童文学",t:"フロプシーのこどもたち",a:"ビアトリクス・ポター",s:"ピーターの妹フロプシーの子うさぎたちが巻き起こす騒動。"},
{c:"児童文学",t:"カルアシチミーのおはなし",a:"ビアトリクス・ポター",s:"ポターの動物絵本シリーズの一冊で、動物たちの日常を描く。"},
{c:"児童文学",t:"秘密の花園",a:"フランシス・ホジソン・バーネット",s:"孤独な少女メアリーが荒れ果てた庭園を再生させていく物語。"},
{c:"児童文学",t:"注文の多い料理店",a:"宮沢賢治",s:"山奥のレストランに入った二人の紳士が体験する不思議な出来事。"},
{c:"児童文学",t:"銀河鉄道の夜",a:"宮沢賢治",s:"少年ジョバンニが銀河を走る幻想的な汽車の旅をする物語。"},
{c:"児童文学",t:"クマのプーさん",a:"A・A・ミルン",s:"くまのプーさんと仲間たちが百エーカーの森で繰り広げる物語。"},
{c:"児童文学",t:"エーミールと探偵たち",a:"エーリヒ・ケストナー",s:"少年エーミールが仲間と協力して盗まれたお金を取り戻す物語。"},
{c:"児童文学",t:"二人のロッテ",a:"エーリヒ・ケストナー",s:"そっくりな双子の少女が入れ替わり両親を再会させようとする物語。"},
{c:"児童文学",t:"ツバメ号とアマゾン号",a:"アーサー・ランサム",s:"湖で船遊びをする子どもたちの夏休みの冒険。"},
{c:"児童文学",t:"大きな森の小さな家",a:"ローラ・インガルス・ワイルダー",s:"開拓時代のアメリカで暮らす一家の暮らしを描いた自伝的物語。"},
{c:"児童文学",t:"小さい牛追い",a:"マリー・ハムズン",s:"ノルウェーの少年オーラが牛追いとして働く日々を描く。"},
{c:"児童文学",t:"牛追いの冬",a:"マリー・ハムズン",s:"「小さい牛追い」の続編で、冬の暮らしを描く物語。"},
{c:"児童文学",t:"君たちはどう生きるか",a:"吉野源三郎",s:"少年コペル君が日常の出来事を通して生き方を学ぶ物語。"},
{c:"児童文学",t:"ホビットの冒険",a:"J・R・R・トールキン",s:"平凡なホビットが竜の財宝を求める冒険に巻き込まれる物語。"},
{c:"児童文学",t:"名探偵カッレくん",a:"アストリッド・リンドグレーン",s:"少年探偵カッレが仲間と町の事件を解決する物語。"},
{c:"児童文学",t:"エルマーのぼうけん",a:"ルース・スタイルス・ガネット",s:"少年エルマーが動物島に囚われた竜を助けに行く冒険。"},
{c:"児童文学",t:"ライオンと魔女",a:"C・S・ルイス",s:"洋服だんすの奥に広がる異世界ナルニアでの兄弟姉妹の冒険。"},
{c:"児童文学",t:"カスピアン王子のつのぶえ",a:"C・S・ルイス",s:"ナルニア国を取り戻すため王子と子どもたちが戦う物語。"},
{c:"児童文学",t:"朝びらき丸　東の海へ",a:"C・S・ルイス",s:"未知の海を旅する船「朝びらき丸」の冒険を描く物語。"},
{c:"児童文学",t:"銀のいす",a:"C・S・ルイス",s:"さらわれた王子を探すナルニアでの旅の物語。"},
{c:"児童文学",t:"馬と少年",a:"C・S・ルイス",s:"奴隷の少年としゃべる馬が自由を求めて旅する物語。"},
{c:"児童文学",t:"魔術師のおい",a:"C・S・ルイス",s:"ナルニア創世の秘密を描くシリーズの前日譚。"},
{c:"児童文学",t:"さいごの戦い",a:"C・S・ルイス",s:"ナルニア国の終焉を描くシリーズ最終巻。"},
{c:"児童文学",t:"夜光人間",a:"江戸川乱歩",s:"怪人「夜光人間」をめぐる少年探偵団の活躍を描く物語。"},
{c:"児童文学",t:"くまのパディントン",a:"マイケル・ボンド",s:"ロンドンの駅で拾われたくま、パディントンの騒動記。"},
{c:"児童文学",t:"パディントンの一周年記念",a:"マイケル・ボンド",s:"パディントンシリーズの一冊、日常のドタバタを描く。"},
{c:"児童文学",t:"パディントンの妙技公開",a:"マイケル・ボンド",s:"パディントンが巻き起こす愉快な騒動を描くシリーズ作。"},
{c:"児童文学",t:"パディントンのクリスマス",a:"マイケル・ボンド",s:"クリスマスを舞台にしたパディントンの物語。"},
{c:"児童文学",t:"チョコレート工場の秘密",a:"ロアルド・ダール",s:"貧しい少年チャーリーが謎のチョコレート工場を見学する物語。"},
{c:"児童文学",t:"くまのコールテンくん",a:"ドン・フリーマン",s:"片方のボタンが取れたくまのぬいぐるみが飼い主を待つ物語。"},
{c:"児童文学",t:"モモ",a:"ミヒャエル・エンデ",s:"時間どろぼうに奪われた「時間」を取り戻す少女モモの物語。"},
{c:"児童文学",t:"こまったさん",a:"寺村輝夫",s:"料理が苦手なこまったさんの騒動を描くコメディシリーズ。"},
{c:"児童文学",t:"わかったさん",a:"寺村輝夫",s:"何でも「わかった」と答えるお菓子屋さんの物語。"},

/* ============ ストレージ ============ */
const STORAGE_KEY = "zoshocho_bookshelf_v1";

function loadBooks(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* fallthrough */ }
  }
  const initial = INITIAL_DATA.map((b,i)=>({
    id: "b" + i + "_" + Date.now(),
    category: b.c, title: b.t, author: b.a, synopsis: b.s, memo: ""
  }));
  saveBooks(initial);
  return initial;
}
function saveBooks(books){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
}

let books = loadBooks();
let activeCategory = "ALL";
let searchTerm = "";
let openBookId = null;
let collapsedCats = new Set();

/* ============ レンダリング ============ */
const shelfEl = document.getElementById("shelf");
const catNavEl = document.getElementById("catNav");
const totalCountEl = document.getElementById("totalCount");

function renderCatNav(){
  const counts = {};
  CATEGORY_ORDER.forEach(c => counts[c] = 0);
  books.forEach(b => { if(counts[b.category] === undefined) counts[b.category]=0; counts[b.category]++; });

  let html = `<div class="cat-chip ${activeCategory==='ALL'?'active':''}" data-cat="ALL">すべて（${books.length}）</div>`;
  CATEGORY_ORDER.forEach(c=>{
    html += `<div class="cat-chip ${activeCategory===c?'active':''}" data-cat="${c}">${c}（${counts[c]||0}）</div>`;
  });
  catNavEl.innerHTML = html;
  catNavEl.querySelectorAll(".cat-chip").forEach(el=>{
    el.addEventListener("click", ()=>{
      activeCategory = el.dataset.cat;
      render();
    });
  });
}

function matchesSearch(b){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return b.title.toLowerCase().includes(t) || b.author.toLowerCase().includes(t);
}

function render(){
  renderCatNav();
  totalCountEl.textContent = `全 ${books.length} 冊`;

  const cats = activeCategory === "ALL" ? CATEGORY_ORDER : [activeCategory];
  let html = "";
  let anyVisible = false;

  cats.forEach(cat=>{
    const list = books.filter(b => b.category === cat && matchesSearch(b));
    if(searchTerm && list.length === 0) return; // hide empty category during search
    anyVisible = true;
    const isCollapsed = collapsedCats.has(cat);
    html += `<section class="category-section ${isCollapsed?'collapsed':''}" data-cat="${cat}">
      <div class="cat-header" data-toggle-cat="${cat}">
        <span class="bar"></span>
        <h2>${cat}</h2>
        <span class="n">${list.length}冊</span>
        <span class="chev"></span>
      </div>
      <div class="cat-body">`;

    if(list.length === 0){
      html += `<div class="empty-hint">まだ本が登録されていません</div>`;
    } else {
      list.forEach(b=>{
        const isOpen = openBookId === b.id;
        html += `<div class="book-row ${isOpen?'open':''}" data-id="${b.id}">
            <div class="titles">
              <div class="title">${escapeHtml(b.title)}</div>
              <div class="synopsis-preview">${escapeHtml(b.synopsis||"")}</div>
            </div>
            <div class="author">${escapeHtml(b.author||"")}</div>
            <div class="caret"></div>
          </div>`;
        if(isOpen){
          html += `<div class="book-detail">
              <div class="row">
                <label>あらすじ</label>
                <div class="synopsis-text">${escapeHtml(b.synopsis||"（未登録）")}</div>
              </div>
              <div class="row">
                <label>メモ</label>
                <textarea data-memo-id="${b.id}" placeholder="感想や気づきを自由に...">${escapeHtml(b.memo||"")}</textarea>
                <div class="memo-actions">
                  <button class="btn ghost small" data-save-memo="${b.id}">メモを保存</button>
                </div>
              </div>
              <div class="del-row">
                <button class="del-link" data-delete="${b.id}">この本を削除</button>
              </div>
            </div>`;
        }
      });
    }
    html += `</div></section>`;
  });

  if(!anyVisible){
    html = `<div class="empty-hint">「${escapeHtml(searchTerm)}」に一致する本が見つかりませんでした</div>`;
  }

  shelfEl.innerHTML = html;
  bindShelfEvents();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}

function bindShelfEvents(){
  shelfEl.querySelectorAll("[data-toggle-cat]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const cat = el.dataset.toggleCat;
      if(collapsedCats.has(cat)) collapsedCats.delete(cat); else collapsedCats.add(cat);
      render();
    });
  });
  shelfEl.querySelectorAll(".book-row").forEach(el=>{
    el.addEventListener("click", (e)=>{
      const id = el.dataset.id;
      openBookId = (openBookId === id) ? null : id;
      render();
    });
  });
  shelfEl.querySelectorAll("[data-save-memo]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = el.dataset.saveMemo;
      const ta = shelfEl.querySelector(`textarea[data-memo-id="${id}"]`);
      const book = books.find(b=>b.id===id);
      if(book){
        book.memo = ta.value;
        saveBooks(books);
        el.textContent = "保存しました ✓";
        setTimeout(()=>{ el.textContent = "メモを保存"; }, 1400);
      }
    });
  });
  shelfEl.querySelectorAll("textarea[data-memo-id]").forEach(ta=>{
    ta.addEventListener("click", e=>e.stopPropagation());
  });
  shelfEl.querySelectorAll("[data-delete]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = el.dataset.delete;
      const book = books.find(b=>b.id===id);
      if(book && confirm(`「${book.title}」を本棚から削除しますか？`)){
        books = books.filter(b=>b.id!==id);
        saveBooks(books);
        openBookId = null;
        render();
      }
    });
  });
}

document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim();
  render();
});

/* ============ 本の追加モーダル ============ */
const overlay = document.getElementById("overlay");
const newCategorySelect = document.getElementById("newCategory");
CATEGORY_ORDER.forEach(c=>{
  const opt = document.createElement("option");
  opt.value = c; opt.textContent = c;
  newCategorySelect.appendChild(opt);
});

const newTitleInput = document.getElementById("newTitle");
const searchBookBtn = document.getElementById("searchBookBtn");
const searchStatus = document.getElementById("searchStatus");
const searchResultArea = document.getElementById("searchResultArea");
const resultAuthor = document.getElementById("resultAuthor");
const resultSynopsis = document.getElementById("resultSynopsis");
const resultCover = document.getElementById("resultCover");
const newMemo = document.getElementById("newMemo");
const confirmAddBtn = document.getElementById("confirmAddBtn");

document.getElementById("openAddBtn").addEventListener("click", openModal);
document.getElementById("closeModalBtn").addEventListener("click", closeModal);
document.getElementById("cancelAddBtn").addEventListener("click", closeModal);
overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });

function openModal(){
  newTitleInput.value = "";
  newMemo.value = "";
  searchStatus.textContent = "";
  searchResultArea.style.display = "none";
  confirmAddBtn.disabled = true;
  overlay.classList.add("show");
  setTimeout(()=>newTitleInput.focus(), 50);
}
function closeModal(){
  overlay.classList.remove("show");
}

searchBookBtn.addEventListener("click", searchBook);
newTitleInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); searchBook(); } });

async function searchBook(){
  const q = newTitleInput.value.trim();
  if(!q){ searchStatus.textContent = "作品名を入力してください。"; return; }
  searchStatus.textContent = "検索中...";
  searchResultArea.style.display = "none";
  confirmAddBtn.disabled = true;

  try{
    const url = "https://www.googleapis.com/books/v1/volumes?q=" +
      encodeURIComponent("intitle:" + q) + "&maxResults=5&langRestrict=ja";
    const res = await fetch(url);
    const data = await res.json();
    const item = pickBestMatch(data.items, q);

    if(!item){
      searchStatus.textContent = "該当する本が見つかりませんでした。著者・あらすじを直接入力してください。";
      resultAuthor.value = "";
      resultSynopsis.value = "";
      resultCover.src = "";
      searchResultArea.style.display = "block";
      confirmAddBtn.disabled = false;
      return;
    }

    const info = item.volumeInfo || {};
    resultAuthor.value = (info.authors || []).join("、") || "";
    resultSynopsis.value = (info.description || "").replace(/<[^>]+>/g,"").slice(0, 300);
    if(info.imageLinks && info.imageLinks.thumbnail){
      resultCover.src = info.imageLinks.thumbnail.replace("http://","https://");
      resultCover.style.display = "block";
    } else {
      resultCover.src = "";
      resultCover.style.display = "none";
    }
    searchStatus.textContent = `「${info.title || q}」が見つかりました。内容を確認して登録してください。`;
    searchResultArea.style.display = "block";
    confirmAddBtn.disabled = false;
  }catch(err){
    console.error(err);
    searchStatus.textContent = "検索に失敗しました（通信環境をご確認ください）。手動で入力できます。";
    resultAuthor.value = "";
    resultSynopsis.value = "";
    searchResultArea.style.display = "block";
    confirmAddBtn.disabled = false;
  }
}

function pickBestMatch(items, query){
  if(!items || items.length===0) return null;
  const norm = s => (s||"").replace(/[\s　]/g,"").toLowerCase();
  const q = norm(query);
  // exact title match first
  let exact = items.find(it => norm(it.volumeInfo && it.volumeInfo.title) === q);
  if(exact) return exact;
  // otherwise item whose title contains the query
  let contains = items.find(it => norm(it.volumeInfo && it.volumeInfo.title).includes(q));
  if(contains) return contains;
  return items[0];
}

confirmAddBtn.addEventListener("click", ()=>{
  const title = newTitleInput.value.trim();
  if(!title) return;
  const newBook = {
    id: "b_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
    category: newCategorySelect.value,
    title: title,
    author: resultAuthor.value.trim(),
    synopsis: resultSynopsis.value.trim(),
    memo: newMemo.value.trim()
  };
  books.push(newBook);
  saveBooks(books);
  closeModal();
  activeCategory = newBook.category;
  openBookId = newBook.id;
  collapsedCats.delete(newBook.category);
  render();
});

/* ============ 初期描画 ============ */
render();
