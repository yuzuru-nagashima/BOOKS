      { id: "78", title: "ゴールデンスランバー", author: "伊坂幸太郎", category: "日本文学", synopsis: "首相暗殺の濡れ衣を着せられた男が、巨大な陰謀から逃亡する圧倒的エンターテインメント。", memo: "" },

      // 海外文学
      { id: "79", title: "ガリヴァー旅行記", author: "ジョナサン・スウィフト", category: "海外文学", synopsis: "小人国や巨人国など風変わりな国々をめぐるガリヴァーの奇想天外な旅と社会風刺。", memo: "" },
      { id: "80", title: "緋色の研究", author: "アーサー・コナン・ドイル", category: "海外文学", synopsis: "名探偵シャーロック・ホームズとワトスンが初めて出会い、復讐劇の謎を解く長編第一作。", memo: "" },
      { id: "81", title: "赤毛連盟", author: "アーサー・コナン・ドイル", category: "海外文学", synopsis: "「赤毛の男」を集める謎の団体の真の目的をホームズが明かす短編の名作。", memo: "" },
      { id: "82", title: "怪盗紳士アルセーヌ・ルパン", author: "モーリス・ルブラン", category: "海外文学", synopsis: "華麗な変装と大胆不敵な手口で人々を魅了する大怪盗ルパンの冒険劇。", memo: "" },
      { id: "83", title: "そして誰もいなくなった", author: "アガサ・クリスティ", category: "海外文学", synopsis: "孤島に招かれた10人の男女が、童謡の歌詞通りに一人ずつ殺されていく本格ミステリ。", memo: "" },
      { id: "84", title: "オリエント急行の殺人", author: "アガサ・クリスティ", category: "海外文学", synopsis: "豪雪で立ち往生した列車内で起きた殺人事件に名探偵ポアロが挑む。", memo: "" },
      { id: "85", title: "動物農場", author: "ジョージ・オーウェル", category: "海外文学", synopsis: "人間を追い出し理想の農場を作った動物たちだったが、やがて独裁が始まる風刺小説。", memo: "" },

      // 洋書
      { id: "86", title: "A Christmas Carol", author: "チャールズ・ディケンズ", category: "洋書", synopsis: "冷酷な守銭奴スクルージが3人の精霊と出会い、改心していくクリスマスの感動の名作。", memo: "" },
      { id: "87", title: "Les Misérables（レ・ミゼラブル）", author: "ヴィクトル・ユゴー", category: "洋書", synopsis: "一本のパンを盗み19年服役したジャン・バルジャンの愛と救済を描く大河ドラマ。", memo: "" },
      { id: "88", title: "Dr Jekyll and Mr. Hyde", author: "R・L・スティーヴンソン", category: "洋書", synopsis: "善のジキル博士と悪のハイド氏。人間の内に潜む二重性を描いた怪奇小説。", memo: "" },
      { id: "89", title: "The Canterville Ghost（カンタヴィルの幽霊）", author: "オスカー・ワイルド", category: "洋書", synopsis: "伝統ある屋敷の幽霊が、現代的なアメリカ人一家に翻弄されるユーモア奇譚。", memo: "" },
      { id: "90", title: "The Hound of the Baskervilles", author: "アーサー・コナン・ドイル", category: "洋書", synopsis: "魔の犬の伝説に怯える一族を救うため、ホームズが湿原の謎に挑む名作。", memo: "" },
      { id: "91", title: "The Chronicles of Narnia", author: "C・S・ルイス", category: "洋書", synopsis: "創世から終焉まで、ナルニア国で繰り広げられる愛と冒険のファンタジー全7巻。", memo: "" },

      // 新書・実用書
      { id: "92", title: "旅をする木", author: "星野道夫", category: "新書・実用書", synopsis: "アラスカの大自然とそこに生きる人々を思索的な文章で綴った至高のエッセイ。", memo: "" },
      { id: "93", title: "寝ながら学べる構造主義", author: "内田樹", category: "新書・実用書", synopsis: "現代思想の重要概念「構造主義」をわかりやすく平易な言葉で解説した入門書。", memo: "" },
      { id: "94", title: "暇と退屈の倫理学", author: "國分功一郎", category: "新書・実用書", synopsis: "人間はなぜ退屈するのか。暇と退屈をキーワードに豊かに生きる道を探る哲学書。", memo: "" },
      { id: "95", title: "僕はイエローでホワイトで、ちょっとブルー", author: "ブレイディみかこ", category: "新書・実用書", synopsis: "英国の中学校に通う息子と母の視線を通し、格差や多様性のリアルを描くノベル。", memo: "" },
      { id: "96", title: "頭がいい人のChatGPT＆Copilotの使い方", author: "橋本大輝", category: "新書・実用書", synopsis: "生成AIを日常や仕事の武器にするためのプロンプト技術と活用実践ガイド。", memo: "" },

      // その他
      { id: "97", title: "インド神話", author: "不詳", category: "その他", synopsis: "ラーマーヤナやマハーバーラタなど、スケールの大きい神々の壮大な伝承。", memo: "" }
    ];

    function App() {
      const [books, setBooks] = useState(() => {
        const saved = localStorage.getItem("bookshelf_data");
        return saved ? JSON.parse(saved) : INITIAL_BOOKS;
      });
      const [searchQuery, setSearchQuery] = useState("");
      const [isModalOpen, setIsModalOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem("bookshelf_data", JSON.stringify(books));
      }, [books]);

      const handleSaveMemo = (id, newMemo) => {
        setBooks(books.map(b => b.id === id ? { ...b, memo: newMemo } : b));
      };

      const handleAddBook = (newBook) => {
        setBooks([newBook, ...books]);
      };

      const filteredBooks = books.filter(b =>
        b.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        b.author.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <main className="max-w-5xl mx-auto px-6 py-12">
          {/* Header */}
          <header className="border-b border-stone-300 pb-6 mb-8 flex justify-between items-end">
            <div>
              <h1 className="text-3xl font-bold tracking-wide text-stone-800">蔵書本棚</h1>
              <p className="text-xs text-stone-500 mt-1 ui-sans">全 {books.length} 冊</p>
            </div>
            <button
              onClick={() => setIsModalOpen(true)}
              className="ui-sans bg-stone-800 text-stone-100 px-5 py-2.5 rounded hover:bg-stone-700 transition shadow-sm text-sm"
            >
              ＋ 新しく本を追加
            </button>
          </header>

          {/* Search */}
          <div className="mb-10 ui-sans">
            <input
              type="text"
              placeholder="タイトルまたは作者で検索..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full md:w-80 px-4 py-2 bg-white border border-stone-300 rounded focus:outline-none focus:ring-1 focus:ring-stone-500 text-sm shadow-inner"
            />
          </div>

          {/* Categories */}
          <div className="space-y-12">
            {CATEGORIES.map(category => {
              const categoryBooks = filteredBooks.filter(b => b.category === category);
              if (categoryBooks.length === 0 && searchQuery) return null;

              return (
                <section key={category} className="space-y-4">
                  <h2 className="text-lg font-bold border-l-4 border-stone-800 pl-3 text-stone-800">
                    {category} ({categoryBooks.length})
                  </h2>

                  {categoryBooks.length === 0 ? (
                    <p className="text-xs text-stone-400 italic ui-sans pl-4">このカテゴリの本はありません</p>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {categoryBooks.map(book => (
                        <BookCard key={book.id} book={book} onSaveMemo={handleSaveMemo} />
                      ))}
                    </div>
                  )}
                </section>
              );
            })}
          </div>

          {/* Modal */}
          {isModalOpen && (
            <AddBookModal
              categories={CATEGORIES}
              onClose={() => setIsModalOpen(false)}
              onAdd={handleAddBook}
            />
          )}
        </main>
      );
    }

    function BookCard({ book, onSaveMemo }) {
      const [memo, setMemo] = useState(book.memo);
      const [isEditing, setIsEditing] = useState(false);

      const handleSave = () => {
        onSaveMemo(book.id, memo);
        setIsEditing(false);
      };

      return (
        <div className="bg-white p-5 rounded border border-stone-200 shadow-sm flex flex-col justify-between hover:shadow-md transition">
          <div>
            <div className="flex justify-between items-start mb-2">
              <h3 className="text-base font-bold text-stone-900 leading-snug">{book.title}</h3>
              <span className="ui-sans text-[10px] bg-stone-100 text-stone-600 px-2 py-0.5 rounded border border-stone-200 shrink-0 ml-2">
                {book.category}
              </span>
            </div>
            <p className="text-xs text-stone-500 mb-3 ui-sans">著者: {book.author}</p>
            <p className="text-xs text-stone-700 leading-relaxed bg-stone-50 p-3 rounded mb-4 border border-stone-100">
              {book.synopsis}
            </p>
          </div>

          <div className="ui-sans pt-3 border-t border-stone-100">
            <div className="flex justify-between items-center mb-1">
              <span className="text-[10px] text-stone-400 font-bold">メモ</span>
              {!isEditing ? (
                <button
                  onClick={() => setIsEditing(true)}
                  className="text-xs text-stone-500 hover:text-stone-800 underline"
                >
                  編集
                </button>
              ) : (
                <button
                  onClick={handleSave}
                  className="text-xs text-stone-800 font-bold hover:underline"
                >
                  保存
                </button>
              )}
            </div>
            {isEditing ? (
              <textarea
                value={memo}
                onChange={(e) => setMemo(e.target.value)}
                className="w-full text-xs p-2 border border-stone-300 rounded focus:outline-none"
                rows={2}
              />
            ) : (
              <p className="text-xs text-stone-600 whitespace-pre-wrap">
                {memo || <span className="text-stone-300 italic">メモはありません</span>}
              </p>
            )}
          </div>
        </div>
      );
    }

    function AddBookModal({ categories, onClose, onAdd }) {
      const [step, setStep] = useState("input");
      const [title, setTitle] = useState("");
      const [category, setCategory] = useState(categories[0]);
      const [author, setAuthor] = useState("");
      const [synopsis, setSynopsis] = useState("");
      const [loading, setLoading] = useState(false);

      const handleSearch = async () => {
        if (!title) return;
        setLoading(true);
        try {
          const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=intitle:${encodeURIComponent(title)}`);
          const data = await res.json();

          if (data.items && data.items.length > 0) {
            const info = data.items[0].volumeInfo;
            setAuthor(info.authors ? info.authors.join(", ") : "不明");
            const desc = info.description || "あらすじ情報が見つかりませんでした。";
            setSynopsis(desc.length > 90 ? desc.substring(0, 90) + "..." : desc);
          } else {
            setAuthor("不明");
            setSynopsis("あらすじ情報が見つかりませんでした。");
          }
        } catch (e) {
          setAuthor("不明");
          setSynopsis("検索中にエラーが発生しました。");
        }
        setLoading(false);
        setStep("confirm");
      };

      const handleConfirm = () => {
        onAdd({
          id: Date.now().toString(),
          title,
          category,
          author,
          synopsis,
          memo: ""
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 ui-sans">
          <div className="bg-white rounded max-w-md w-full p-6 shadow-lg border border-stone-200">
            <h3 className="text-base font-bold text-stone-800 mb-4">
              {step === "input" ? "新しい本を追加" : "確認・確定"}
            </h3>

            {step === "input" ? (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-stone-600 mb-1">カテゴリー</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full p-2 border border-stone-300 rounded text-xs bg-white"
                  >
                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-medium text-stone-600 mb-1">作品名</label>
                  <input
                    type="text"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="例: 銀河鉄道の夜"
                    className="w-full p-2 border border-stone-300 rounded text-xs"
                  />
                </div>
                <div className="flex justify-end gap-2 pt-4">
                  <button
                    onClick={onClose}
                    className="px-4 py-2 text-xs text-stone-600 hover:bg-stone-100 rounded"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={handleSearch}
                    disabled={loading || !title}
                    className="px-4 py-2 text-xs bg-stone-800 text-white rounded hover:bg-stone-700 disabled:opacity-50"
                  >
                    {loading ? "検索中..." : "作者・あらすじを検索"}
                  </button>
                </div>
              </div>
            ) : (
              <div className="space-y-4">
                <div className="text-xs space-y-2 bg-stone-50 p-4 rounded border border-stone-200">
                  <p><span className="font-bold">作品名:</span> {title}</p>
                  <p><span className="font-bold">カテゴリー:</span> {category}</p>
                  <p><span className="font-bold">作者:</span> {author}</p>
                  <p><span className="font-bold">あらすじ:</span> {synopsis}</p>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setStep("input")}
                    className="px-4 py-2 text-xs text-stone-600 hover:bg-stone-100 rounded"
                  >
                    修正する
                  </button>
                  <button
                    onClick={handleConfirm}
                    className="px-4 py-2 text-xs bg-stone-800 text-white rounded hover:bg-stone-700"
                  >
                    確定して登録
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
