<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ本棚</title>
  
  <!-- ④ ホーム画面用アイコンの設定 -->
  <link rel="apple-touch-icon" href="https://loosedrawing.com/illust/435/">
  <link rel="icon" href="https://loosedrawing.com/illust/435/">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f0f6ff;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px 12px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      color: var(--primary);
      margin: 0 0 8px 0;
      font-size: 1.8rem;
    }

    /* 検索セクション */
    .search-box {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:active {
      background-color: var(--primary-hover);
    }

    button.secondary {
      background-color: #94a3b8;
    }

    /* 候補リスト */
    .search-results {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-item {
      padding: 10px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }

    .result-item:hover {
      background: #eff6ff;
    }

    /* 本棚リスト */
    .book-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .book-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border-left: 5px solid var(--primary);
    }

    .book-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 4px 0;
      color: var(--primary);
    }

    .book-author {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .book-section-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .book-desc, .book-memo {
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 4px 0 12px 0;
      white-space: pre-wrap;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-edit {
      background-color: #3b82f6;
      padding: 6px 12px;
      font-size: 13px;
    }

    .btn-delete {
      background-color: #ef4444;
      padding: 6px 12px;
      font-size: 13px;
    }

    /* モーダル (ポップアップ) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📚 マイ本棚</h1>
    </header>

    <!-- 検索/手動追加エリア -->
    <div class="search-box">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="本や作者のタイトルを入力...">
        <button onclick="searchBooks()">検索</button>
      </div>
      <div id="searchResults" class="search-results"></div>
      <div style="text-align: right; margin-top: 8px;">
        <button class="secondary" style="font-size: 12px; padding: 4px 8px;" onclick="openConfirmModal('', '', '')">手動で本を追加</button>
      </div>
    </div>

    <!-- 本一覧 -->
    <div id="bookList" class="book-list"></div>
  </div>

  <!-- ③＆② 追加・編集用確認モーダル -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modalTitle">本棚に追加する</h2>
      <div class="form-group">
        <label>タイトル</label>
        <input type="text" id="modalBookTitle">
      </div>
      <div class="form-group">
        <label>著者 / 作者</label>
        <input type="text" id="modalBookAuthor">
      </div>
      <div class="form-group">
        <label>あらすじ / 概要</label>
        <textarea id="modalBookDesc" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label>自分の感想・メモ</label>
        <textarea id="modalBookMemo" rows="3" placeholder="感想やメモをここに入力できます..."></textarea>
      </div>
      <div class="card-actions" style="margin-top: 16px;">
        <button class="secondary" onclick="closeModal()">キャンセル</button>
        <button onclick="saveModalData()">保存する</button>
      </div>
    </div>
  </div>

  <script>
    let books = JSON.parse(localStorage.getItem('my_books') || '[]');
    let currentEditIndex = null; // 編集中のインデックス (nullの場合は新規)

    // 初期表示
    renderBooks();

    // Wikipedia検索機能
    async function searchBooks() {
      const query = document.getElementById('searchInput').value.trim();
      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';

      if (!query) return;

      resultsContainer.innerHTML = '<p style="font-size: 14px; color: #64748b;">検索中...</p>';

      try {
        const res = await fetch(`https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
        const data = await res.json();
        const results = data.query.search;

        resultsContainer.innerHTML = '';
        if (results.length === 0) {
          resultsContainer.innerHTML = '<p style="font-size: 14px; color: #64748b;">見つかりませんでした。</p>';
          return;
        }

        results.slice(0, 3).forEach(item => {
          const div = document.createElement('div');
          div.className = 'result-item';
          const cleanSnippet = item.snippet.replace(/<[^>]*>?/gm, '');
          div.innerHTML = `<strong>${item.title}</strong><br><small style="color:#64748b;">${cleanSnippet.substring(0, 50)}...</small>`;
          
          // 選択されたらプレビュー確認画面（モーダル）を開く
          div.onclick = () => {
            resultsContainer.innerHTML = '';
            document.getElementById('searchInput').value = '';
            openConfirmModal(item.title, 'Wikipediaより', cleanSnippet);
          };
          resultsContainer.appendChild(div);
        });
      } catch (e) {
        resultsContainer.innerHTML = '<p style="font-size: 14px; color: red;">エラーが発生しました。</p>';
      }
    }

    // ③＆② モーダルを開く（新規追加確認 または 編集）
    function openConfirmModal(title = '', author = '', desc = '', memo = '', index = null) {
      currentEditIndex = index;
      document.getElementById('modalTitle').textContent = index === null ? 'この内容で本棚に追加しますか？' : '本を編集';
      document.getElementById('modalBookTitle').value = title;
      document.getElementById('modalBookAuthor').value = author;
      document.getElementById('modalBookDesc').value = desc;
      document.getElementById('modalBookMemo').value = memo;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
      currentEditIndex = null;
    }

    // モーダルの保存ボタンを押したとき
    function saveModalData() {
      const title = document.getElementById('modalBookTitle').value.trim();
      const author = document.getElementById('modalBookAuthor').value.trim();
      const desc = document.getElementById('modalBookDesc').value.trim();
      const memo = document.getElementById('modalBookMemo').value.trim();

      if (!title) {
        alert('タイトルを入力してください');
        return;
      }

      const bookData = { title, author, desc, memo };

      if (currentEditIndex === null) {
        // 新規追加
        books.unshift(bookData);
      } else {
        // ② 既存データの更新
        books[currentEditIndex] = bookData;
      }

      saveAndRender();
      closeModal();
    }

    // ② 既存の本を編集モーダルで開く
    function editBook(index) {
      const b = books[index];
      openConfirmModal(b.title, b.author || '', b.desc || '', b.memo || '', index);
    }

    // 本の削除
    function deleteBook(index) {
      if (confirm('この本を本棚から削除しますか？')) {
        books.splice(index, 1);
        saveAndRender();
      }
    }

    // 保存と描画
    function saveAndRender() {
      localStorage.setItem('my_books', JSON.stringify(books));
      renderBooks();
    }

    // 画面の更新
    function renderBooks() {
      const container = document.getElementById('bookList');
      container.innerHTML = '';

      if (books.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#64748b; margin-top:32px;">本棚は空です。上から検索して追加してみましょう！</p>';
        return;
      }

      books.forEach((b, index) => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div class="book-title">${escapeHtml(b.title)}</div>
          <div class="book-author">${escapeHtml(b.author || '著者不明')}</div>
          ${b.desc ? `<div class="book-section-title">あらすじ</div><div class="book-desc">${escapeHtml(b.desc)}</div>` : ''}
          ${b.memo ? `<div class="book-section-title">感想・メモ</div><div class="book-memo">${escapeHtml(b.memo)}</div>` : ''}
          <div class="card-actions">
            <button class="btn-edit" onclick="editBook(${index})">編集</button>
            <button class="btn-delete" onclick="deleteBook(${index})">削除</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
